version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gem-tender-db
    environment:
      POSTGRES_USER: gem
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: gem_tender
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem -d gem_tender"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network

  redis:
    image: redis:7-alpine
    container_name: gem-tender-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network

volumes:
  pgdata:
    driver: local

networks:
  gem-network:
    driver: bridge
