version: '3.8' 
services:
  postgres:
    image: postgres:16-alpine
    container_name: gem-tender-db
    environment:
      POSTGRES_USER: gem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gem_tender
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem -d gem_tender"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: gem-tender-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: gem-tender-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      PYTHONPATH: /app/src
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      PHONEPE_CLIENT_ID: ${PHONEPE_CLIENT_ID}
      PHONEPE_CLIENT_SECRET: ${PHONEPE_CLIENT_SECRET}
      PHONEPE_CLIENT_VERSION: ${PHONEPE_CLIENT_VERSION:-1}
      PHONEPE_AUTH_BASE_URL: ${PHONEPE_AUTH_BASE_URL}
      PHONEPE_PG_BASE_URL: ${PHONEPE_PG_BASE_URL}
      PHONEPE_WEBHOOK_BASE_URL: ${PHONEPE_WEBHOOK_BASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-gem-tender-dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      LICENSE_ACTIVE_KID: ${LICENSE_ACTIVE_KID:-v1}
      LICENSE_PRIVATE_KEY_PATH: ${LICENSE_PRIVATE_KEY_PATH:-/keys/signing_private_v1.pem}
      LICENSE_PUBLIC_KEY_PATH: ${LICENSE_PUBLIC_KEY_PATH:-/keys/signing_public_v1.pem}
      LOCAL_ADMIN_USER_IDS: ${LOCAL_ADMIN_USER_IDS:-["1"]}
      LICENSING_MODE: ${LICENSING_MODE:-off}
      GOOGLE_APPLICATION_CREDENTIALS: /gcs-key.json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/scripts:/app/scripts
      - ./packages/db-models:/packages/db-models
      - ./packages/licensing:/packages/licensing
      - pdfs_data:/pdfs
      - ${DATA_DIR:-./data}/keys:/keys:ro
    networks:
      - gem-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir /app/src
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    container_name: gem-tender-worker
    environment:
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONPATH: /app/src
      DOWNLOAD_DIR: /pdfs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker/src:/app/src
      - ./packages/db-models:/packages/db-models
      - pdfs_data:/pdfs
    networks:
      - gem-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  celery-beat:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    container_name: gem-tender-beat
    environment:
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONPATH: /app/src
    depends_on:
      - redis
    volumes:
      - ./apps/worker/src:/app/src
      - ./packages/db-models:/packages/db-models
    networks:
      - gem-network
    command: celery -A celery_app beat --loglevel=info
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: gem-tender-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      INTERNAL_API_URL: "http://api:8000"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    networks:
      - gem-network
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  pdfs_data:
  web_node_modules:
    driver: local

networks:
  gem-network:
    driver: bridge
