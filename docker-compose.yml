services:
  postgres:
    image: postgres:16-alpine
    container_name: gem-tender-db
    environment:
      POSTGRES_USER: gem
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: gem_tender
    ports:
      - "5432:5432"
    volumes:
      - F:/GeM_Tender_SaaS/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem -d gem_tender"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network

  redis:
    image: redis:7-alpine
    container_name: gem-tender-redis
    ports:
      - "6379:6379"
    volumes:
      - F:/GeM_Tender_SaaS/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: gem-tender-api
    environment:
      DATABASE_URL: postgresql+asyncpg://gem:devpass@postgres:5432/gem_tender
      SYNC_DATABASE_URL: postgresql://gem:devpass@postgres:5432/gem_tender
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      DEBUG: "true"
      PYTHONPATH: /app/src
      APP_BASE_URL: http://localhost:3000
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      # Clerk Auth
      CLERK_JWKS_URL: "https://firm-stallion-78.clerk.accounts.dev/.well-known/jwks.json"
      CLERK_ISSUER: "https://firm-stallion-78.clerk.accounts.dev"
      CLERK_SECRET_KEY: "sk_test_XG8BXk5PXcnUPmrRtnRzznYA4vumvT4p4YUFI0kjhM"
      # Stripe — leave blank to disable billing in local dev
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_STARTER: ""
      STRIPE_PRICE_PRO: ""
      STRIPE_PRICE_BUSINESS: ""
      # Cloudflare R2 (optional for local dev)
      S3_ENDPOINT: ""
      S3_BUCKET: gem-tender-dev
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/db-models:/packages/db-models
      - F:/GeM_Tender_SaaS/data/pdfs:/pdfs
    networks:
      - gem-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app/src

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    container_name: gem-tender-worker
    environment:
      SYNC_DATABASE_URL: postgresql://gem:devpass@postgres:5432/gem_tender
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      PYTHONPATH: /app/src
      DOWNLOAD_DIR: /pdfs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker/src:/app/src
      - ./packages/db-models:/packages/db-models
      - F:/GeM_Tender_SaaS/data/pdfs:/pdfs
    networks:
      - gem-network

  celery-beat:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    container_name: gem-tender-beat
    environment:
      SYNC_DATABASE_URL: postgresql://gem:devpass@postgres:5432/gem_tender
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      PYTHONPATH: /app/src
    depends_on:
      - redis
    volumes:
      - ./apps/worker/src:/app/src
      - ./packages/db-models:/packages/db-models
    networks:
      - gem-network
    command: celery -A celery_app beat --loglevel=info

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: deps          # stop at deps stage so node_modules are available for dev
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: gem-tender-web
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZmlybS1zdGFsbGlvbi03OC5jbGVyay5hY2NvdW50cy5kZXYk"
      CLERK_SECRET_KEY: "sk_test_XG8BXk5PXcnUPmrRtnRzznYA4vumvT4p4YUFI0kjhM"
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app                  # live source mount for hot-reload
      - web_node_modules:/app/node_modules  # persist node_modules across restarts
    networks:
      - gem-network
    command: npm run dev
    depends_on:
      - api

volumes:
  # pgdata removed — Postgres data is bind-mounted to F:/GeM_Tender_SaaS/data/postgres
  # redis data is bind-mounted to F:/GeM_Tender_SaaS/data/redis
  web_node_modules:
    driver: local

networks:
  gem-network:
    driver: bridge
