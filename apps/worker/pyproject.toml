[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-worker"
version = "0.1.0"
description = "GeM Tender SaaS Celery Worker"
authors = [{name = "GeM Team"}]
dependencies = [
    "celery[redis]>=5.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "db-models @ file:../../packages/db-models",
    "playwright>=1.44",
    "playwright-stealth>=1.0.6",
    "pdfplumber>=0.11",
    "requests>=2.31",
    "boto3>=1.34",
    "openpyxl>=3.1",
]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
