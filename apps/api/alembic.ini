# Alembic Configuration

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# file_template = %%(rev)s_%%(at)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the "create_date" field in the migration file
# as well as the filename.
# string value is passed to os.environ['TZ']
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by Alembic
# when it generates a new migration
# undefined does not limit the character length of the generated filename
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sqlalchemy.url uses the value of the environment
# variable SQLALCHEMY_DATABASE_URL as the database URL
# sqlalchemy.url is blank and you should use the ALEMBIC_SQLALCHEMY_URL environment variable
# ALEMBIC_SQLALCHEMY_URL or SQLALCHEMY_DATABASE_URL environment variable
sqlalchemy.url = 

# Logging configuration
# Logging can specify that it should only handle records at or above a given
# level; this example silently ignores all "debug" records transferred between
# the file handlers and logger handlers.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
