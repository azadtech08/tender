[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenzo-licensing"
version = "0.1.0"
description = "Tenzo license token signing and verification primitives (PASETO v4.public / Ed25519)."
authors = [{name = "GeM Team"}]
requires-python = ">=3.12"
dependencies = [
    "pyseto>=1.7",
    "pydantic>=2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
tenzo-licensing-keygen = "tenzo_licensing.scripts.generate_keypair:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
