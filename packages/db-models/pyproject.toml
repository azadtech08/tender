[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-models"
version = "0.1.0"
description = "GeM Tender SaaS — Shared SQLAlchemy ORM models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["db_models"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
db_models = ["py.typed"]
